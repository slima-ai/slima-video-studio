packages:
  - apps/*
  - packages/*

# pnpm 10 預設不跑 postinstall；只放行必要的套件
# （Electron 44 沒有 postinstall，第一次 require('electron') 時才會下載執行檔）
onlyBuiltDependencies:
  - esbuild
  # 下載對應平台的 FFmpeg 執行檔（打包版內建，使用者不用另外安裝）
  - ffmpeg-static

# 避免同一個套件被安裝多個版本而造成型別衝突
overrides:
  '@types/node': 22.20.5
  vite: 7.3.7
  # pnpm audit（high 以上才失敗）：這幾個都是經過 slima-mcp 進來的相依套件，slima-mcp 沒有新版可升，只能在這裡拉到修好的版本
  # zod：slima-mcp 只收 ^3.23.0，而 zod 的修補（GHSA-mrhx-c7xc-m3w5）只有 4.6.6 以上
  'slima-mcp>zod': 4.6.6
  # body-parser（GHSA-27r3-jxmh-p828）、fast-uri（moderate／low）
  body-parser: ^2.4.0
  fast-uri: ^3.1.9
